# Render Blueprint for Amanat (server + web app + admin + Android download, one free service).
# Database: the free Neon project "p2p-trust". Paste its connection string into DATABASE_URL
# when Render asks (sync: false keeps it out of git).
services:
  - type: web
    name: amanat
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_SECRET
        generateValue: true
      - key: RELEASE_CODE_SECRET
        generateValue: true
      - key: NID_PEPPER
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: COURIER_WEBHOOK_SECRET
        generateValue: true
      - key: SANDBOX_MODE
        value: "1"
      - key: PG_POOL_MAX
        value: "5"
